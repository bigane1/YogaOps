# CI + déploiement automatique sur VPS (SSH + git).
#
# Obligatoire dans GitHub (Settings → Secrets and variables → Actions) :
#   Secret VPS_SSH_PRIVATE_KEY — clé privée PEM dont la clé publique est sur le VPS (~/.ssh/authorized_keys)
#
# Optionnel (sinon valeurs par défaut OVH ci-dessous) :
#   Secrets ou variables : VPS_HOST, VPS_USER
#   Variable : VPS_APP_DIR (chemin du clone sur le serveur)
#   Variable : VPS_SSH_PORT (défaut 22)
#
# Défauts si non définis : host IPv4 OVH, user ubuntu, dossier /home/ubuntu/YogaOps
#
# Côté VPS : clone du dépôt dans VPS_APP_DIR (ou ce chemin par défaut), .env, Node LTS, PM2 ou DEPLOY_RESTART_CMD.

name: CI & déploiement VPS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Prisma (client)
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Base SQLite pour le build CI
        run: npx prisma migrate deploy

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps-production
      cancel-in-progress: false

    steps:
      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || '51.91.253.165' }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ vars.VPS_SSH_PORT || 22 }}
          # build Next sur un petit VPS peut dépasser le défaut (~10 min)
          command_timeout: 45m
          script: |
            set -euo pipefail
            cd "${{ vars.VPS_APP_DIR || '/home/ubuntu/YogaOps' }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            bash scripts/vps-deploy.sh
