# CI + déploiement automatique sur VPS (SSH + git).
#
# Secrets GitHub (Settings → Secrets and variables → Actions) — au moins un des deux :
#   VPS_SSH_PRIVATE_KEY — clé privée PEM complète (recommandé ; publique dans authorized_keys sur le VPS)
#   VPS_SSH_PASSWORD — mot de passe SSH du compte (ex. ubuntu), si pas de clé
#   Sans l’un ou l’autre : erreur « can't connect without a private SSH key or password ».
#
# Optionnel (sinon valeurs par défaut OVH ci-dessous) :
#   Secrets ou variables : VPS_HOST, VPS_USER
#   Variable : VPS_APP_DIR (chemin du clone sur le serveur)
#   Variable : VPS_SSH_PORT (défaut 22)
#
# Défauts si non définis : host IPv4 OVH, user ubuntu, dossier /home/ubuntu/YogaOps
#
# Côté VPS : clone du dépôt dans VPS_APP_DIR (ou ce chemin par défaut), .env, Node LTS, PM2 ou DEPLOY_RESTART_CMD.

name: CI & déploiement VPS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Prisma (client)
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Base SQLite pour le build CI
        run: npx prisma migrate deploy

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps-production
      cancel-in-progress: false

    steps:
      - name: Vérifier auth SSH (clé ou mot de passe)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_PASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${SSH_KEY:-}" ] && [ -z "${SSH_PASS:-}" ]; then
            echo "::error::Ajoutez au moins VPS_SSH_PRIVATE_KEY ou VPS_SSH_PASSWORD dans les secrets du dépôt (Actions)."
            exit 1
          fi

      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || '51.91.253.165' }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: ${{ vars.VPS_SSH_PORT || 22 }}
          # build Next sur un petit VPS peut dépasser le défaut (~10 min)
          command_timeout: 45m
          script: |
            set -euo pipefail
            APP_DIR="${{ vars.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              for CANDIDATE in /var/www/yogaops /var/www/YogaOps /var/yogaops /var/YogaOps /home/ubuntu/YogaOps /root/YogaOps; do
                if [ -d "$CANDIDATE/.git" ] && [ -f "$CANDIDATE/.env" ]; then
                  APP_DIR="$CANDIDATE"
                  break
                fi
              done
              APP_DIR="${APP_DIR:-/var/www/yogaops}"
            fi
            echo "=== Dossier app : $APP_DIR ==="
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown "$(whoami):$(whoami)" "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            bash scripts/vps-deploy.sh

      - name: Vérifier yogaops.fr (pas seulement localhost VPS)
        run: |
          set -euo pipefail
          echo "=== Verification publique https://yogaops.fr/ ==="
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 https://yogaops.fr/ || echo "000")
            echo "tentative $attempt : HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
              echo "=== OK : site public accessible ==="
              exit 0
            fi
            sleep 15
          done
          echo "::error::yogaops.fr ne repond pas correctement (502 ou autre) apres deploy"
          exit 1
