# CI + déploiement automatique sur VPS (SSH + git).
#
# Configuration GitHub :
#   Secrets : VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY (clé privée PEM, sans mot de passe)
#   Variables : VPS_APP_DIR (chemin absolu du clone git sur le serveur, ex. /var/www/yogaops)
#   Optionnel  : VPS_SSH_PORT (défaut 22)
#
# Côté VPS (une fois) :
#   - git clone du dépôt dans VPS_APP_DIR
#   - fichier .env avec DATABASE_URL, Stripe, SMTP, etc.
#   - utilisateur SSH avec clé autorisée, accès au dossier du projet
#   - Node.js LTS + npm ; PM2 (`npm i -g pm2`) ou variable DEPLOY_RESTART_CMD sur le serveur

name: CI & déploiement VPS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Prisma (client)
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Base SQLite pour le build CI
        run: npx prisma migrate deploy

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps-production
      cancel-in-progress: false

    steps:
      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ vars.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ vars.VPS_APP_DIR }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            bash scripts/vps-deploy.sh
