# CI + déploiement automatique sur VPS (SSH + git).
#
# Configuration GitHub (Settings → Secrets and variables → Actions) :
#   Secrets : VPS_SSH_PRIVATE_KEY (clé privée PEM)
#             VPS_HOST et VPS_USER (recommandé : pas stockés en clair dans les variables)
#   OU Variables : VPS_HOST, VPS_USER (IP/nom du serveur + user SSH — si pas en secrets)
#   Variable : VPS_APP_DIR (chemin absolu du clone sur le serveur, ex. /var/www/yogaops)
#   Optionnel : VPS_SSH_PORT (défaut 22)
#
# Si VPS_HOST / VPS_USER sont absents, le job « deploy » est ignoré (CI verte) avec un avertissement.
#
# Côté VPS (une fois) :
#   - git clone du dépôt dans VPS_APP_DIR
#   - fichier .env avec DATABASE_URL, Stripe, SMTP, etc.
#   - utilisateur SSH avec clé autorisée, accès au dossier du projet
#   - Node.js LTS + npm ; PM2 (`npm i -g pm2`) ou script scripts/vps-deploy.sh

name: CI & déploiement VPS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Prisma (client)
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Base SQLite pour le build CI
        run: npx prisma migrate deploy

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Détermine si les identifiants SSH sont présents sans faire échouer le workflow.
  vps-gate:
    name: Config VPS pour déploiement
    needs: ci
    if: needs.ci.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          H='${{ secrets.VPS_HOST || vars.VPS_HOST }}'
          U='${{ secrets.VPS_USER || vars.VPS_USER }}'
          if [ -n "$H" ] && [ -n "$U" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "VPS SSH : host et utilisateur présents — le déploiement peut s'exécuter."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Déploiement VPS ignoré : ajoutez VPS_HOST et VPS_USER (secrets ou variables du dépôt). Actuellement ils sont vides pour ce workflow."
          fi

  deploy:
    needs: [ci, vps-gate]
    if: needs.ci.result == 'success' && needs.vps-gate.result == 'success' && needs.vps-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps-production
      cancel-in-progress: false

    steps:
      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ vars.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ vars.VPS_APP_DIR }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            bash scripts/vps-deploy.sh
