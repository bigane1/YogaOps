# CI + déploiement automatique sur VPS (SSH + git).
#
# Configuration GitHub :
#   Obligatoire :
#     Secret VPS_SSH_PRIVATE_KEY (clé privée PEM)
#     VPS_APP_DIR (variable : chemin du clone sur le serveur, ex. /var/www/yogaops)
#   Host / utilisateur SSH : secret VPS_HOST et VPS_USER **ou** variables VPS_HOST et VPS_USER
#     (si l’IP était en « variable » au lieu de « secret », le déploiement voyait un host vide.)
#   Optionnel : VPS_SSH_PORT (défaut 22)
#
# Côté VPS (une fois) :
#   - git clone du dépôt dans VPS_APP_DIR
#   - fichier .env avec DATABASE_URL, Stripe, SMTP, etc.
#   - utilisateur SSH avec clé autorisée, accès au dossier du projet
#   - Node.js LTS + npm ; PM2 (`npm i -g pm2`) ou variable DEPLOY_RESTART_CMD sur le serveur

name: CI & déploiement VPS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Prisma (client)
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Base SQLite pour le build CI
        run: npx prisma migrate deploy

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps-production
      cancel-in-progress: false

    steps:
      - name: Vérifier host et utilisateur SSH
        env:
          H: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          U: ${{ secrets.VPS_USER || vars.VPS_USER }}
        run: |
          if [ -z "$H" ]; then
            echo "::error::VPS_HOST est vide. Ajoutez le secret VPS_HOST ou la variable de dépôt VPS_HOST (IP ou nom du serveur)."
            exit 1
          fi
          if [ -z "$U" ]; then
            echo "::error::VPS_USER est vide. Ajoutez le secret VPS_USER ou la variable VPS_USER."
            exit 1
          fi

      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ vars.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ vars.VPS_APP_DIR }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            bash scripts/vps-deploy.sh
